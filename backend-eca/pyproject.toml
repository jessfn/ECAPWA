# backend-eca — configuración del proyecto
#
# ECA-001: solo estructura base (sin dependencias de runtime).
# ECA-002: app FastAPI mínima, settings, engine+pool SQLAlchemy, Alembic,
#          logging estructurado, manejo de errores uniforme. Se añaden aquí
#          las dependencias de runtime correspondientes.

[project]
name = "backend-eca"
version = "0.0.1"
description = "Backend del sistema ECA (Escuelas de Campo)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "gunicorn>=23.0,<24; platform_system != 'Windows'",
    "sqlalchemy>=2.0.35,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.13,<1.14",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "argon2-cffi>=23.1,<24",
    "pyjwt>=2.9,<3",
    "python-multipart>=0.0.12,<0.1",
    "openpyxl>=3.1,<4",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
